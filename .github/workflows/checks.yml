name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install USB libraries
        run: python -m pip install -r requirements.txt
      - name: Install Linux USB runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0
      - name: Check native USB library loads (no USB bus required)
        run: python scripts/check_usb_library.py
      - name: Python tests and local HTTP smoke test
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node --test tests/temperature.test.mjs tests/recipe-progress.test.mjs
      - name: JavaScript syntax
        run: node --check web/studio.js
      - name: Check macOS launch scripts
        if: runner.os == 'macOS'
        run: |
          bash -n scripts/macos.sh
          bash -n 'Start Roasting.command'
          bash -n 'Connect ChatGPT.command'
          bash -n 'Stop Roasting.command'
          test -x 'Start Roasting.command'
          # Simulate Finder on a clean Mac: no Homebrew, Node, or Python on PATH.
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          source scripts/macos.sh
          roast_setup
          roast_codex
          .venv/bin/python -c 'import sys; from pathlib import Path; assert Path(sys.base_prefix).resolve().is_relative_to(Path(".runtime/python").resolve())'
          .runtime/bin/codex exec --help | grep -- --ignore-user-config
          # A second setup must reuse installed binaries/packages without network.
          export HTTPS_PROXY=http://127.0.0.1:1 HTTP_PROXY=http://127.0.0.1:1 ALL_PROXY=http://127.0.0.1:1 UV_OFFLINE=1
          roast_setup
          roast_codex
          unset HTTPS_PROXY HTTP_PROXY ALL_PROXY UV_OFFLINE
          .venv/bin/python -c 'import libusb_package; assert libusb_package.get_libusb1_backend() is not None'
          .venv/bin/python tests/smoke_mac_launcher.py
