name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install USB libraries
        run: python -m pip install -r requirements.txt
      - name: Install Linux USB runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0
      - name: Check USB backend loads (no device access)
        run: python -c "import libusb_package; assert libusb_package.get_libusb1_backend() is not None"
      - name: Python tests and local HTTP smoke test
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node --test tests/temperature.test.mjs tests/recipe-progress.test.mjs
      - name: JavaScript syntax
        run: node --check web/studio.js
      - name: Check macOS launch scripts
        if: runner.os == 'macOS'
        run: |
          bash -n scripts/macos.sh
          bash -n 'Start Roasting.command'
          bash -n 'Connect ChatGPT.command'
          bash -n 'Stop Roasting.command'
          test -x 'Start Roasting.command'
          source scripts/macos.sh
          roast_setup
          .venv/bin/python -c 'import libusb_package; assert libusb_package.get_libusb1_backend() is not None'
          .venv/bin/python tests/smoke_mac_launcher.py
